- name: Install zsh and Neovim with Homebrew
  community.general.homebrew:
    name:
      - zsh
      - neovim
    state: present

- name: Find homebrew zsh path
  ansible.builtin.shell: command -v zsh
  register: homebrew_zsh
  changed_when: false

- name: Ensure zsh is the default shell for this user via user profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.profile"
    marker: "# {mark} dev-setup default shell fallback"
    create: true
    block: |
      # If running interactively and zsh is available, switch to it
      if [ -t 0 ] && command -v zsh >/dev/null 2>&1; then
        exec zsh -l
      fi

- name: Make Neovim the default editor in zsh
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} dev-setup editor defaults"
    create: true
    block: |
      export EDITOR=nvim
      export VISUAL=nvim
      export GIT_EDITOR=nvim
      alias vim='nvim'
      alias vi='nvim'

- name: Set Git to use Neovim as its editor
  ansible.builtin.shell: |
    git config --global core.editor nvim
  changed_when: false

- name: Verify zsh and nvim are available
  ansible.builtin.shell: |
    command -v zsh
    command -v nvim
  register: tool_check
  changed_when: false

- name: Show installed tool paths
  ansible.builtin.debug:
    var: tool_check.stdout_lines

- name: Check if oh my zsh exists
  ansible.builtin.shell: test -d ~/.oh-my-zsh && echo exists || echo nope
  register: zsh_exists
  changed_when: false

- name: Install oh my zsh
  when: zsh_exists.stdout == 'nope'
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" -- --unattended