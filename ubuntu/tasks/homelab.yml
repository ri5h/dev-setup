- name: Ensure k3s is installed
  become: true
  ansible.builtin.shell: |
    if ! command -v k3s >/dev/null 2>&1; then
      echo "k3s not found; installing it now..."
      curl -sfL https://get.k3s.io | sh -
    else
      echo "k3s is already installed at $(command -v k3s)"
    fi
  changed_when: false

- name: Verify the k3s cluster is reachable
  become: true
  ansible.builtin.shell: |
    k3s kubectl get node
  register: k3s_node_check
  changed_when: false