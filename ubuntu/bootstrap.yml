- hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Verify Ansible version.
      assert:
        that: ansible_version.full is version_compare('2.13.0', '>=')
        msg: You must update Ansible to at least 2.13.0 to run this playbook.

    - name: Verify target system is Ubuntu.
      assert:
        that: ansible_facts['distribution'] == 'Ubuntu'
        msg: The target system is not running Ubuntu.

  tasks:
    - name: Configure the Ubuntu development environment
      include_tasks: tasks/coding.yml
    - name: Run the homelab setup playbook with k3s
      include_tasks: tasks/homelab.yml
